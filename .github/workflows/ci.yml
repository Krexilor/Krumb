name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC 14)
            os: ubuntu-24.04
            cmake_args: -DCMAKE_CXX_COMPILER=g++-14
          - name: Windows (MSVC)
            os: windows-latest
          - name: macOS (Apple Clang)
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKRUMB_WARNINGS_AS_ERRORS=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
